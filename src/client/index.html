<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese Practice</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <nav class="sidebar">
      <h2 class="sidebar-title">Memchin</h2>
      <a class="nav-item active" data-view="practice">Practice</a>
      <a class="nav-item" data-view="add-word">Add Word</a>
    </nav>
    <div class="main-content">
      <label class="theme-toggle" id="theme-toggle" title="Toggle dark mode">
        <input type="checkbox" id="theme-checkbox">
        <span class="theme-toggle-track"><span class="theme-toggle-thumb"></span></span>
        <span class="theme-toggle-label">Dark mode</span>
      </label>
      <div id="start-screen" class="screen active">
        <h1>Chinese Practice</h1>
        <div class="start-layout">
          <div class="category-panel">
            <div class="category-panel-title">Options</div>
            <div class="panel-options">
              <label class="checkbox-label">
                <input type="checkbox" id="autoplay-audio" checked>
                Auto-play audio
              </label>
            </div>
            <div class="category-panel-title">Categories</div>
            <input type="text" id="category-search" class="category-search" placeholder="Search…" autocomplete="off">
            <div class="category-selected" id="category-selected"></div>
            <div class="category-box" id="category-list"></div>
          </div>
          <div class="start-main">
            <div id="stats" class="stats"></div>
          </div>
        </div>
      </div>

      <div id="practice-screen" class="screen">
        <div class="progress-bar">
          <span id="progress-text">Question 1 of 10</span>
        </div>

        <div id="prompt" class="prompt"></div>

        <div class="answer-section">
          <input type="text" id="answer-input" placeholder="Your answer..." autocomplete="off">
          <button id="submit-btn" class="primary-btn">Submit</button>
          <button id="skip-btn" class="secondary-btn">I don't know</button>
        </div>

        <div id="feedback" class="feedback hidden"></div>
        <div class="practice-actions hidden" id="practice-actions">
          <button id="next-btn" class="primary-btn">Next</button>
          <button id="edit-word-btn" class="edit-word-btn">Edit word</button>
          <button id="reset-word-btn" class="edit-word-btn">Reset word</button>
        </div>
        <div class="quit-actions">
          <button id="finish-btn" class="quit-btn">Finish &amp; save progress</button>
          <button id="quit-btn" class="quit-btn">Quit without saving</button>
        </div>
      </div>

      <div id="result-screen" class="screen">
        <h2>Session Complete!</h2>

        <div id="result-stats" class="result-stats"></div>

        <div id="mistakes-section" class="mistakes-section hidden">
          <h3>Results:</h3>
          <ul id="mistakes-list"></ul>
        </div>

        <button id="restart-btn" class="primary-btn">Practice Again</button>
      </div>

      <div id="add-word-screen" class="screen">
        <h1>Add Word</h1>
        <div class="add-word-form">
          <div class="form-group">
            <label for="add-hanzi">Hanzi</label>
            <input type="text" id="add-hanzi" placeholder="e.g. 电脑" autocomplete="off">
            <div id="word-info" class="word-info hidden"></div>
            <div id="cedict-entries" class="cedict-entries hidden"></div>
            <div id="word-breakdown" class="hidden"></div>
          </div>
          <div class="form-group">
            <label for="add-pinyin">Pinyin</label>
            <input type="text" id="add-pinyin" placeholder="e.g. diànnǎo or dian4nao3" autocomplete="off">
          </div>
          <div class="form-group">
            <label>English</label>
            <div class="chip-input-container">
              <div id="english-chips" class="chips"></div>
              <input type="text" id="add-english" placeholder="Type and press Enter" autocomplete="off">
            </div>
          </div>
          <div class="form-group">
            <label>Categories</label>
            <div class="chip-input-container">
              <div id="category-chips" class="chips"></div>
              <input type="text" id="add-categories" placeholder="Type and press Enter" autocomplete="off">
              <div id="category-suggestions" class="category-suggestions hidden"></div>
            </div>
          </div>
          <label class="checkbox-label" id="reset-bucket-label">
            <input type="checkbox" id="reset-bucket-cb" checked>
            Reset to bucket 0
          </label>
          <div class="add-word-actions">
            <button id="add-word-btn" class="primary-btn">Add</button>
            <button id="cancel-edit-btn" class="secondary-btn hidden">Cancel</button>
            <button id="reset-progress-btn" class="danger-btn hidden">Reset progress</button>
          </div>
          <div id="add-word-status" class="add-word-status hidden"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
