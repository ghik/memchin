<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinese Practice</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <nav class="sidebar">
      <h2 class="sidebar-title">Memchin</h2>
      <a class="nav-item active" data-view="practice" href="/">Practice</a>
      <a class="nav-item" data-view="search" href="/explore">Explore</a>
      <a class="nav-item" data-view="add-word" href="/add">Add Word</a>
    </nav>
    <div class="main-content">
      <div class="global-controls">
        <label class="volume-control" for="audio-volume" title="Audio playback volume">
          <input type="range" id="audio-volume" min="0" max="100" step="1" value="100">
          <span class="volume-value" id="audio-volume-value">100%</span>
        </label>
        <label class="toggle-switch" id="mute-toggle" title="Mute audio">
          <input type="checkbox" id="mute-checkbox">
          <span class="toggle-switch-track"><span class="toggle-switch-thumb"></span></span>
          <span class="toggle-switch-label">Mute</span>
        </label>
        <label class="toggle-switch" id="theme-toggle" title="Toggle dark mode">
          <input type="checkbox" id="theme-checkbox">
          <span class="toggle-switch-track"><span class="toggle-switch-thumb"></span></span>
          <span class="toggle-switch-label">Dark mode</span>
        </label>
      </div>
      <div id="start-screen" class="screen active">
        <h1>Chinese Practice</h1>
        <div class="start-layout">
          <div class="category-panel">
            <div class="category-panel-title">Categories</div>
            <input type="text" id="category-search" class="category-search" placeholder="Search…" autocomplete="off">
            <div class="category-selected" id="category-selected"></div>
            <div class="category-box" id="category-list"></div>
          </div>
          <div class="start-main">
            <div id="stats" class="stats"></div>
          </div>
        </div>
      </div>

      <div id="practice-screen" class="screen">
        <div class="practice-columns">
          <div class="practice-question">
            <div class="progress-bar">
              <span id="progress-text">Question 1 of 10</span>
            </div>

            <div id="prompt" class="prompt"></div>

            <div class="answer-section">
              <input type="text" id="answer-input" placeholder="Your answer..." autocomplete="off">
              <button id="submit-btn" class="primary-btn">Submit</button>
              <button id="skip-btn" class="secondary-btn">I don't know</button>
            </div>
          </div>

          <div class="practice-answer">
            <div id="feedback" class="feedback hidden"></div>
            <div class="practice-actions hidden" id="practice-actions">
              <button id="next-btn" class="primary-btn">Next</button>
              <button id="edit-word-btn" class="edit-word-btn">Edit word</button>
              <button id="reset-word-btn" class="edit-word-btn">Reset word</button>
            </div>
          </div>
        </div>
        <div class="quit-actions">
          <button id="finish-btn" class="quit-btn">Finish &amp; save progress</button>
          <button id="quit-btn" class="quit-btn">Quit without saving</button>
        </div>
      </div>

      <div id="result-screen" class="screen">
        <h2>Session Complete!</h2>

        <div id="result-stats" class="result-stats"></div>

        <div id="mistakes-section" class="mistakes-section hidden">
          <h3>Results:</h3>
          <ul id="mistakes-list"></ul>
        </div>

        <button id="restart-btn" class="primary-btn">Practice Again</button>
      </div>

      <div id="search-screen" class="screen">
        <div id="search-inputs">
          <div class="search-field">
            <label class="search-label">Hanzi</label>
            <input type="text" id="search-hanzi" autocomplete="off">
            <div class="match-mode-group" id="hanzi-mode-group">
              <button class="match-mode-btn" data-mode="prefix">prefix</button>
              <button class="match-mode-btn active" data-mode="contains">contains</button>
              <button class="match-mode-btn" data-mode="suffix">suffix</button>
              <button class="match-mode-btn" data-mode="exact">exact</button>
            </div>
          </div>
          <div class="search-field">
            <label class="search-label">Pinyin</label>
            <input type="text" id="search-pinyin" autocomplete="off">
            <div class="match-mode-group" id="pinyin-mode-group">
              <button class="match-mode-btn" data-mode="prefix">prefix</button>
              <button class="match-mode-btn active" data-mode="contains">contains</button>
              <button class="match-mode-btn" data-mode="suffix">suffix</button>
              <button class="match-mode-btn" data-mode="exact">exact</button>
            </div>
          </div>
          <div class="search-field">
            <label class="search-label">English</label>
            <input type="text" id="search-english" autocomplete="off">
          </div>
        </div>
        <div id="search-results"></div>
      </div>

      <div id="add-word-screen" class="screen">
        <h1>Add Word</h1>
        <div class="add-word-form">
          <div class="form-group">
            <label for="add-hanzi">Hanzi</label>
            <input type="text" id="add-hanzi" placeholder="e.g. 电脑" autocomplete="off">
            <div id="word-info" class="word-info hidden"></div>
            <div id="cedict-entries" class="cedict-entries hidden"></div>
            <div id="word-breakdown" class="hidden"></div>
            <div class="infer-row">
              <button id="infer-btn" class="aux-btn infer-btn">✨ Infer with AI</button>
            </div>
            <div id="ai-assessment" class="ai-assessment hidden"></div>
          </div>
          <div class="form-group">
            <label for="add-pinyin">Pinyin</label>
            <input type="text" id="add-pinyin" placeholder="e.g. diànnǎo or dian4nao3" autocomplete="off">
          </div>
          <div class="form-group">
            <label>English</label>
            <div id="english-list" class="english-list"></div>
            <div class="english-item english-add-row">
              <span class="drag-handle" aria-hidden="true">⠿</span>
              <input type="text" id="add-english" placeholder="Type and press Enter to add" autocomplete="off">
              <span class="english-item-remove" aria-hidden="true">×</span>
            </div>
          </div>
          <div class="form-group hidden" id="ai-english-group">
            <label><span class="ai-mark" aria-hidden="true">✨</span> AI English</label>
            <div id="ai-english-list" class="english-list"></div>
          </div>
          <div class="form-group">
            <label>Polish</label>
            <div id="polish-list" class="english-list"></div>
            <div class="english-item english-add-row">
              <span class="drag-handle" aria-hidden="true">⠿</span>
              <input type="text" id="add-polish" placeholder="Type and press Enter to add" autocomplete="off">
              <span class="english-item-remove" aria-hidden="true">×</span>
            </div>
          </div>
          <div class="form-group">
            <label>Categories</label>
            <div class="chip-input-container">
              <div id="category-chips" class="chips"></div>
              <input type="text" id="add-categories" placeholder="Type and press Enter" autocomplete="off">
              <div id="category-suggestions" class="category-suggestions hidden"></div>
            </div>
            <div id="ai-category-chips" class="chips ai-chips hidden"></div>
          </div>
          <div class="form-group">
            <label for="ai-notes"><span class="ai-mark" aria-hidden="true">✨</span> Usage notes</label>
            <textarea id="ai-notes" rows="3" placeholder="Filled in by AI inference; edit or clear freely"></textarea>
          </div>
          <div class="form-group hidden" id="synonyms-group">
            <label for="add-synonym">Synonyms</label>
            <div id="synonym-list" class="synonym-list"></div>
            <div class="synonym-add-container">
              <div class="synonym-item synonym-add-row">
                <input type="text" id="add-synonym" placeholder="Search learned words by hanzi or pinyin" autocomplete="off">
                <span class="synonym-item-remove" aria-hidden="true">×</span>
              </div>
              <div id="synonym-suggestions" class="category-suggestions synonym-suggestions hidden"></div>
            </div>
          </div>
          <label class="checkbox-label" id="queue-as-new-label">
            <input type="checkbox" id="queue-as-new-cb" checked>
            Queue as new for practice
          </label>
          <div class="add-word-aux-actions">
            <button id="regen-audio-btn" class="aux-btn hidden">Regen audio</button>
            <button id="regen-examples-btn" class="aux-btn hidden">Regen examples</button>
            <button id="make-char-only-btn" class="aux-btn hidden">Char-only</button>
            <button id="make-word-mode-btn" class="aux-btn hidden">Word-mode</button>
            <button id="reset-progress-btn" class="aux-btn hidden">Reset</button>
          </div>
          <div class="add-word-actions">
            <button id="cancel-edit-btn" class="cancel-btn hidden">Cancel</button>
            <button id="add-word-btn" class="primary-btn">Add</button>
          </div>
          <div id="add-word-status" class="add-word-status hidden"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
